<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trivial del Almacén</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --fondo1:#1b1446; --fondo2:#2c1a72; --panel:rgba(255,255,255,.08); --panel2:rgba(255,255,255,.14);
  --texto:#fff; --suave:rgba(255,255,255,.72);
  --rojo:#e8384f; --azul:#2d7ff9; --amarillo:#f5b700; --verde:#1fb45a;
  --rosa:#ff4fa3; --naranja:#ff8a1f; --morado:#8b5cf6; --cian:#14c4d6;
  --radio:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Fredoka',system-ui,sans-serif;color:var(--texto);
  background:radial-gradient(1200px 700px at 15% 0%,#4b2bb3 0%,transparent 60%),
             radial-gradient(900px 600px at 100% 100%,#c2187a55 0%,transparent 60%),
             linear-gradient(160deg,var(--fondo1),var(--fondo2));
  background-attachment:fixed;min-height:100vh;overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:0}
input{font-family:inherit}
.oculto{display:none!important}
#app{min-height:100vh}

/* ---------- elementos comunes ---------- */
.marca{display:flex;align-items:center;gap:14px}
.marca h1{font-size:clamp(28px,4vw,56px);font-weight:700;letter-spacing:.5px;line-height:1}
.marca small{display:block;font-size:clamp(14px,1.4vw,20px);color:var(--suave);font-weight:500;margin-top:4px}
.btn{
  background:#fff;color:#2a1a6e;font-weight:700;font-size:clamp(18px,1.8vw,26px);
  padding:16px 34px;border-radius:999px;box-shadow:0 6px 0 #00000040;transition:transform .08s;
}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #00000040}
.btn.color{background:var(--amarillo);color:#2a1a6e}
.btn.secundario{background:var(--panel2);color:#fff;box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:var(--radio);padding:24px}
.aviso{background:#ffcf3a;color:#2a1a6e;border-radius:14px;padding:10px 16px;font-weight:600;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;font-weight:600;
  font-size:clamp(16px,1.5vw,22px);color:#fff;animation:entra .35s ease-out}
.chip .x{background:#0003;color:#fff;border-radius:50%;width:24px;height:24px;font-size:14px;line-height:24px;text-align:center}
@keyframes entra{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pop{0%{transform:scale(.2) rotate(-30deg);opacity:0}70%{transform:scale(1.15) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* ---------- PANTALLA (profesor) ---------- */
.pantalla{min-height:100vh;display:flex;flex-direction:column;padding:28px clamp(20px,3vw,48px);gap:24px}
.barra{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.barra .derecha{display:flex;gap:10px;align-items:center}
.etiqueta{background:var(--panel2);border-radius:999px;padding:8px 18px;font-weight:600;font-size:clamp(15px,1.4vw,20px)}
.centro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center}

.inicio-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;width:100%;max-width:1200px;text-align:left}
.lista-niveles{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.fila-nivel{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:16px;padding:12px 16px;font-size:20px}
.fila-nivel .num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none}
.fila-nivel .n{color:var(--suave);margin-left:auto;font-size:16px;white-space:nowrap}
.campo{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.campo label{color:var(--suave);font-size:16px}
.campo input{font-size:22px;padding:10px 14px;border-radius:12px;border:2px solid rgba(255,255,255,.2);background:#0002;color:#fff;width:140px}

.lobby{display:grid;grid-template-columns:auto 1fr;gap:36px;width:100%;max-width:1400px;align-items:start}
.qr-caja{background:#fff;border-radius:28px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:12px;color:#2a1a6e}
.qr-caja #qr{width:min(34vw,360px);height:min(34vw,360px)}
.qr-caja #qr img,.qr-caja #qr canvas{width:100%!important;height:100%!important}
.codigo{font-size:clamp(40px,5vw,72px);font-weight:700;letter-spacing:10px;line-height:1}
.url{font-size:14px;word-break:break-all;max-width:360px;text-align:center;color:#5b4ca8}
.jugadores{display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start;min-height:120px}
.contador{font-size:clamp(22px,2.4vw,34px);font-weight:600}

.intro-nivel .quesito-grande{width:min(36vh,300px);height:min(36vh,300px);animation:pop .7s ease-out}
.intro-nivel h2{font-size:clamp(36px,5vw,76px);line-height:1.05}
.intro-nivel p{font-size:clamp(20px,2vw,30px);color:var(--suave)}

.pregunta-txt{font-size:clamp(28px,3.6vw,58px);font-weight:600;line-height:1.15;max-width:1300px;
  background:#fff;color:#22155d;border-radius:28px;padding:28px 36px;box-shadow:0 10px 0 #0003}
.zona-tiempo{display:flex;align-items:center;justify-content:center;gap:40px;flex-wrap:wrap}
.reloj{position:relative;width:clamp(110px,11vw,160px);height:clamp(110px,11vw,160px)}
.reloj svg{width:100%;height:100%;transform:rotate(-90deg)}
.reloj .num{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(40px,4.4vw,64px);font-weight:700}
.reloj.urgente .num{color:#ffcf3a;animation:latido .5s infinite}
.respondidas{font-size:clamp(20px,2vw,30px);font-weight:600;background:var(--panel2);border-radius:20px;padding:14px 24px}
.respondidas b{font-size:1.5em}
.opciones{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:100%;max-width:1400px}
.opcion{display:flex;align-items:center;gap:18px;border-radius:20px;padding:22px 26px;text-align:left;
  font-size:clamp(20px,2.3vw,36px);font-weight:600;color:#fff;position:relative;overflow:hidden;box-shadow:0 6px 0 #0003;min-height:96px}
.opcion .forma{font-size:1.1em;flex:none;width:1.4em;text-align:center}
.opcion .barra-votos{position:absolute;left:0;bottom:0;height:8px;background:#fff9;transition:width .8s}
.opcion .votos{margin-left:auto;font-size:.85em;background:#0003;border-radius:12px;padding:4px 14px;flex:none}
.opcion.apagada{opacity:.3;filter:saturate(.4)}
.opcion.correcta{outline:6px solid #fff;animation:latido 1s 2}
.o0{background:var(--rojo)}.o1{background:var(--azul)}.o2{background:var(--amarillo)}.o3{background:var(--verde)}

.resultado-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:28px;width:100%;max-width:1500px;align-items:start}
.resultado-grid .opciones{grid-template-columns:1fr}
.resultado-grid .opcion{min-height:70px;padding:16px 22px;font-size:clamp(18px,1.8vw,28px)}
.tabla-top h3{font-size:24px;margin-bottom:12px;text-align:left}
.fila-rank{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:14px;padding:10px 14px;margin-bottom:8px;font-size:clamp(17px,1.6vw,24px);text-align:left}
.fila-rank .pos{width:34px;font-weight:700;color:var(--suave)}
.fila-rank .punto{width:14px;height:14px;border-radius:50%;flex:none}
.fila-rank .nom{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila-rank .pts{font-weight:700}
.fila-rank .mas{color:#7dffb0;font-size:.8em;margin-left:6px}
.fila-rank.oro{background:linear-gradient(90deg,#f5b70055,var(--panel))}

.fin-nivel{width:100%;max-width:1300px;display:flex;flex-direction:column;gap:22px;align-items:center}
.ganadores{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.ganador{display:flex;flex-direction:column;align-items:center;gap:10px;animation:pop .7s ease-out both}
.ganador .q{width:120px;height:120px}
.ganador .nom{font-size:clamp(26px,3vw,44px);font-weight:700}
.ganador .pts{color:var(--suave);font-size:22px}
.rank-cols{columns:2 320px;column-gap:18px;width:100%}
.rank-cols .fila-rank{break-inside:avoid}

.tabla-final{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:clamp(16px,1.5vw,22px)}
.tabla-final th{color:var(--suave);font-weight:500;padding:4px 10px;text-align:center}
.tabla-final th:nth-child(2),.tabla-final td:nth-child(2){text-align:left}
.tabla-final td{background:var(--panel);padding:10px;text-align:center}
.tabla-final td:first-child{border-radius:14px 0 0 14px;font-weight:700}
.tabla-final td:last-child{border-radius:0 14px 14px 0}
.tabla-final td.q-celda svg{width:40px;height:40px;vertical-align:middle}
.tabla-final td.ganado{color:#fff;font-weight:700}
.scroll{max-height:52vh;overflow:auto;width:100%;padding-right:6px}

.podio{display:flex;align-items:flex-end;justify-content:center;gap:18px;margin-top:10px}
.peldano{display:flex;flex-direction:column;align-items:center;gap:8px;animation:pop .8s ease-out both}
.peldano .q{width:clamp(70px,7vw,110px);height:clamp(70px,7vw,110px)}
.peldano .nom{font-size:clamp(20px,2.4vw,36px);font-weight:700;max-width:260px;text-align:center;overflow-wrap:anywhere}
.peldano .bloque{width:clamp(130px,14vw,220px);border-radius:18px 18px 0 0;display:grid;place-items:center;font-size:clamp(34px,4vw,60px);font-weight:700}
.peldano.p1 .bloque{height:130px;background:var(--amarillo);color:#2a1a6e}
.peldano.p2 .bloque{height:95px;background:#cfd6e6;color:#2a1a6e}
.peldano.p3 .bloque{height:65px;background:#e0975a;color:#2a1a6e}
.peldano .det{color:var(--suave);font-size:18px}

/* ---------- MÓVIL (jugador) ---------- */
.movil{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:18px 16px calc(18px + env(safe-area-inset-bottom));gap:16px}
.movil .cabecera{display:flex;justify-content:space-between;align-items:center;font-weight:600;gap:10px}
.movil .yo{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:999px;padding:6px 14px 6px 6px;font-size:16px;max-width:65%}
.movil .yo .punto{width:26px;height:26px;border-radius:50%;flex:none}
.movil .yo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.movil .cuerpo{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;text-align:center}
.movil h2{font-size:30px;line-height:1.1}
.movil p{color:var(--suave);font-size:18px}
.movil .entrada{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.movil .entrada input{font-size:24px;padding:16px;border-radius:16px;border:0;text-align:center;color:#22155d;font-weight:600;width:100%}
.movil .entrada .btn{width:100%}
.movil .error{color:#ffcf3a;font-weight:600;min-height:24px}
.movil .botones{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:12px;width:100%}
.movil .botones.dos{grid-template-columns:1fr}
.movil .resp{border-radius:20px;color:#fff;font-size:19px;font-weight:600;padding:14px 10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 0 #0003;line-height:1.15;overflow-wrap:anywhere}
.movil .resp .forma{font-size:34px}
.movil .resp:active{transform:translateY(3px);box-shadow:0 3px 0 #0003}
.movil .barra-tiempo{height:12px;background:#ffffff26;border-radius:999px;overflow:hidden;width:100%}
.movil .barra-tiempo i{display:block;height:100%;background:#fff;border-radius:999px;width:100%}
.movil .preg-movil{background:#fff;color:#22155d;border-radius:18px;padding:14px 16px;font-size:18px;font-weight:600;text-align:left;line-height:1.25}
.movil .grande{font-size:84px;line-height:1;animation:pop .6s ease-out}
.movil .puntos{font-size:44px;font-weight:700}
.movil .quesito-movil{width:150px;height:150px;animation:pop .7s ease-out}
.movil.ok{background:linear-gradient(160deg,#0f8a45,#1fb45a)}
.movil.mal{background:linear-gradient(160deg,#9e1b32,#e8384f)}

@media (max-width:900px){
  .inicio-grid,.lobby,.resultado-grid{grid-template-columns:1fr}
  .qr-caja #qr{width:260px;height:260px}
  .opciones{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   1. CONFIGURACIÓN DE FIREBASE
   Pega aquí los datos de tu proyecto (Configuración del proyecto →
   Tus apps → Web). Mientras databaseURL esté vacío, el juego funciona
   en MODO PRUEBA: solo entre pestañas del mismo navegador.
   Reglas de Realtime Database (pestaña «Reglas»):
     { "rules": { "trivialAlmacen": { "salas": { "$sala": {
         ".read": true, ".write": true } } } } }
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  databaseURL: "",
  projectId: "",
  appId: ""
};

/* =====================================================================
   2. AJUSTES DEL JUEGO
   ===================================================================== */
const AJUSTES = {
  titulo: "Trivial del Almacén",
  subtitulo: "Almacenaje · 1.º Grado Básico de Servicios Comerciales",
  segundosPorPregunta: 20,     // se puede cambiar también en la pantalla de inicio
  segundosPuntuacionMaxima: 5, // si aciertan en estos segundos: puntuación máxima
  puntosMaximos: 100,
  puntosMinimos: 10            // lo que vale un acierto en el último segundo
};

/* =====================================================================
   3. PREGUNTAS — un nivel por tema
   Cada pregunta: texto, opciones (2 a 4) y "correcta" = posición de la
   respuesta buena empezando a contar en 0 (0 = primera, 1 = segunda…).
   ⚠ PREGUNTAS DE EJEMPLO: se sustituirán por las del profesor.
   ===================================================================== */
const NIVELES = [
  {
    tema: "El almacén y sus zonas",
    preguntas: [
      { texto: "¿Cuál es la función principal de un almacén?",
        opciones: ["Guardar y custodiar la mercancía hasta que se necesite", "Fabricar los productos", "Hacer la publicidad de la empresa", "Cobrar a los clientes"], correcta: 0 },
      { texto: "¿En qué zona del almacén se descargan y revisan las mercancías que llegan?",
        opciones: ["Expedición", "Recepción", "Oficinas", "Zona de picking"], correcta: 1 },
      { texto: "¿Desde qué zona salen los pedidos preparados hacia los clientes?",
        opciones: ["Recepción", "Vestuarios", "Expedición", "Zona de devoluciones"], correcta: 2 },
      { texto: "Preparar un pedido cogiendo los productos de las estanterías se llama…",
        opciones: ["Picking", "Marketing", "Leasing", "Branding"], correcta: 0 }
    ]
  },
  {
    tema: "Medios de transporte",
    preguntas: [
      { texto: "¿Qué medio de transporte es el más rápido para enviar un paquete urgente de Madrid a Nueva York?",
        opciones: ["Barco", "Camión", "Tren", "Avión"], correcta: 3 },
      { texto: "Para traer 2.000 contenedores desde China hasta Valencia, ¿qué medio es el más adecuado?",
        opciones: ["Avión", "Marítimo", "Carretera", "Furgoneta"], correcta: 1 },
      { texto: "El transporte multimodal es el que…",
        opciones: ["Usa siempre el avión", "Solo funciona dentro de una ciudad", "Combina al menos dos medios de transporte distintos", "Lleva un único producto"], correcta: 2 },
      { texto: "¿Qué medio permite llevar la mercancía «puerta a puerta» con más flexibilidad?",
        opciones: ["Carretera", "Tubería", "Marítimo", "Aéreo"], correcta: 0 }
    ]
  },
  {
    tema: "Manipulación de mercancías",
    preguntas: [
      { texto: "¿Qué es un palé?",
        opciones: ["Una caja de cartón pequeña", "Una plataforma sobre la que se apila la mercancía para moverla", "Un tipo de camión", "Una etiqueta con código de barras"], correcta: 1 },
      { texto: "Verdadero o falso: para levantar una caja pesada hay que doblar las rodillas y mantener la espalda recta.",
        opciones: ["Verdadero", "Falso"], correcta: 0 },
      { texto: "El método FIFO significa que…",
        opciones: ["Lo último que entra es lo primero que sale", "Se vende lo más caro primero", "Lo primero que entra es lo primero que sale", "Se guarda todo en el suelo"], correcta: 2 },
      { texto: "¿Qué máquina se usa para elevar palés hasta las estanterías altas?",
        opciones: ["Carretilla elevadora", "Cinta transportadora", "Báscula", "Lector de códigos"], correcta: 0 }
    ]
  }
];

/* =====================================================================
   A PARTIR DE AQUÍ, EL FUNCIONAMIENTO DEL JUEGO
   ===================================================================== */
const COLORES_NIVEL = ["#2d7ff9","#ff4fa3","#f5b700","#1fb45a","#ff8a1f","#8b5cf6","#14c4d6","#e8384f"];
const COLORES_JUG = ["#e8384f","#2d7ff9","#f5b700","#1fb45a","#ff4fa3","#ff8a1f","#8b5cf6","#14c4d6","#ef6c8f","#5ab0ff","#9adf4a","#c77dff"];
const FORMAS = ["▲","◆","●","■"];
const RAIZ = "trivialAlmacen/salas";
const params = new URLSearchParams(location.search);
const $app = document.getElementById("app");

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const colorNivel = i => COLORES_NIVEL[i % COLORES_NIVEL.length];
const nuevoId = () => Math.random().toString(36).slice(2, 10);

function quesitoSVG(total, ganados = [], resaltar = -1) {
  // Círculo dividido en tantas porciones como niveles; las ganadas, en color.
  const r = 46, c = 50, partes = [];
  if (total === 1) {
    const col = ganados.includes(0) ? colorNivel(0) : "rgba(255,255,255,.08)";
    partes.push(`<circle cx="50" cy="50" r="${r}" fill="${col}" stroke="#fff" stroke-width="3"/>`);
  } else {
    for (let i = 0; i < total; i++) {
      const a0 = (i / total) * 2 * Math.PI - Math.PI / 2, a1 = ((i + 1) / total) * 2 * Math.PI - Math.PI / 2;
      const x0 = c + r * Math.cos(a0), y0 = c + r * Math.sin(a0), x1 = c + r * Math.cos(a1), y1 = c + r * Math.sin(a1);
      const grande = (a1 - a0) > Math.PI ? 1 : 0;
      const relleno = ganados.includes(i) || i === resaltar ? colorNivel(i) : "rgba(255,255,255,.08)";
      partes.push(`<path d="M${c},${c} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${grande} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${relleno}" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>`);
    }
  }
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${partes.join("")}<circle cx="50" cy="50" r="${r}" fill="none" stroke="#fff" stroke-width="4"/></svg>`;
}

/* ---------------------------------------------------------------------
   CONEXIÓN: Firebase Realtime Database o modo prueba (localStorage)
   --------------------------------------------------------------------- */
const T = (() => {
  let modo = "prueba", db = null, offset = 0;
  const LS = "trivialAlmacen_prueba";
  const oyentes = [];
  const leer = () => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } };
  const ruta = (o, p) => p.split("/").reduce((a, k) => (a == null ? undefined : a[k]), o);
  function poner(o, p, v) {
    const ks = p.split("/"); let a = o;
    for (let i = 0; i < ks.length - 1; i++) { if (typeof a[ks[i]] !== "object" || a[ks[i]] === null) a[ks[i]] = {}; a = a[ks[i]]; }
    if (v === null || v === undefined) delete a[ks[ks.length - 1]]; else a[ks[ks.length - 1]] = v;
  }
  function avisar() {
    const o = leer();
    oyentes.forEach(l => {
      let v = ruta(o, l.p); if (v === undefined) v = null;
      const s = JSON.stringify(v);
      if (s !== l.ultimo) { l.ultimo = s; l.cb(v === null ? null : JSON.parse(s)); }
    });
  }
  window.addEventListener("storage", e => { if (e.key === LS) avisar(); });
  const cargar = src => new Promise((ok, mal) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = mal; document.head.appendChild(s); });

  return {
    async iniciar() {
      if (FIREBASE_CONFIG.databaseURL && !params.has("prueba")) {
        try {
          await cargar("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");
          await cargar("https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js");
          firebase.initializeApp(FIREBASE_CONFIG);
          db = firebase.database();
          db.ref(".info/serverTimeOffset").on("value", s => { offset = s.val() || 0; });
          modo = "firebase";
        } catch (e) { console.error(e); modo = "error"; }
      }
      return modo;
    },
    modo: () => modo,
    ahora: () => Date.now() + offset,
    sello: () => (modo === "firebase" ? firebase.database.ServerValue.TIMESTAMP : Date.now()),
    set(p, v) {
      if (modo === "firebase") return db.ref(p).set(v);
      const o = leer(); poner(o, p, v); localStorage.setItem(LS, JSON.stringify(o)); avisar(); return Promise.resolve();
    },
    async get(p) {
      if (modo === "firebase") return (await db.ref(p).once("value")).val();
      const v = ruta(leer(), p); return v === undefined ? null : v;
    },
    on(p, cb) {
      if (modo === "firebase") { const r = db.ref(p); const h = s => cb(s.val()); r.on("value", h); return () => r.off("value", h); }
      const l = { p, cb, ultimo: undefined }; oyentes.push(l); setTimeout(avisar, 0);
      return () => { const i = oyentes.indexOf(l); if (i >= 0) oyentes.splice(i, 1); };
    },
    limpiarPrueba() { if (modo !== "firebase") { localStorage.removeItem(LS); } }
  };
})();

/* ---------------------------------------------------------------------
   PUNTUACIÓN
   --------------------------------------------------------------------- */
function calcularPuntos(segundos, duracion) {
  const a = AJUSTES.segundosPuntuacionMaxima, M = AJUSTES.puntosMaximos, m = AJUSTES.puntosMinimos;
  if (segundos <= a) return M;
  const f = Math.min(1, (segundos - a) / Math.max(1, duracion - a));
  return Math.round(M - (M - m) * f);
}

function codigoSala() {
  const L = "ABCDEFGHJKLMNPQRSTUVWXYZ"; let s = "";
  for (let i = 0; i < 4; i++) s += L[Math.floor(Math.random() * L.length)];
  return s;
}
function leerDuracion() {
  const el = document.getElementById("dur");
  if (el) { const v = parseInt(el.value, 10); if (v >= 8 && v <= 90) H.duracion = v; }
}

async function crearSala() {
  leerDuracion();

  Object.assign(H, { sala: codigoSala(), jugadores: {}, nivel: 0, pregunta: 0, puntos: {}, aciertos: {}, quesitos: {}, actual: null, ultimo: null });
  await T.set(rutaSala(), { estado: { fase: "lobby", creada: T.ahora() } });
  escucharJugadores();
  guardarPartida();
  hostLobby();
}

async function reanudar() {

  escucharJugadores();
  if (g.fase === "lobby") return hostLobby();
  if (H.pregunta >= NIVELES[H.nivel].preguntas.length) return finNivel();
  await T.set(`${rutaSala()}/estado`, { fase: "pausa" });
  H.fase = "pausa";
  $app.innerHTML = `<div class="pantalla">${cabeceraPantalla()}<div class="centro">

}

function urlJugador() {

}

async function lanzarPregunta() {
  const nv = NIVELES[H.nivel], q = nv.preguntas[H.pregunta];
  const clave = `n${H.nivel}p${H.pregunta}_${Date.now().toString(36)}`;

  H.actual = { clave, inicio, q, idx: H.pregunta, respuestas: {}, cerrada: false };
  H.fase = "pregunta";
  await T.set(`${rutaSala()}/estado`, {
    fase: "pregunta", nivel: H.nivel, tema: nv.tema, pregunta: H.pregunta, total: nv.preguntas.length,
    texto: q.texto, opciones: q.opciones, duracion: H.duracion, inicio, clave
  });
  $app.innerHTML = `<div class="pantalla">${cabeceraPantalla(`<span class="etiqueta" style="background:${colorNivel(H.nivel)}">Nivel ${H.nivel + 1} · Pregunta ${H.pregunta + 1}/${nv.preguntas.length}</span>`)}
    <div class="centro">
      <div class="pregunta-txt">${esc(q.texto)}</div>
      <div class="zona-tiempo">
        <div class="reloj" id="reloj"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="10"/>
          <circle id="arco" cx="50" cy="50" r="44" fill="none" stroke="${colorNivel(H.nivel)}" stroke-width="10" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg>
          <div class="num" id="segs">${H.duracion}</div></div>
        <div class="respondidas" id="respondidas"></div>
        <button class="btn secundario" onclick="cerrarPregunta()">Cerrar ya</button>
      </div>
      <div class="opciones">${q.opciones.map((o, i) => `<div class="opcion o${i}"><span class="forma">${FORMAS[i]}</span><span>${esc(o)}</span></div>`).join("")}</div>
    </div></div>`;
  actualizarRespondidas();
  offRespuestas && offRespuestas();
  offRespuestas = T.on(`${rutaSala()}/respuestas/${clave}`, v => {
    if (!H.actual || H.actual.clave !== clave || H.actual.cerrada) return;
    H.actual.respuestas = v || {};
    actualizarRespondidas();
    const conectados = Object.keys(H.jugadores);
    if (conectados.length && conectados.every(id => H.actual.respuestas[id])) setTimeout(() => cerrarPregunta(), 700);
  });
  clearInterval(relojId);
  relojId = setInterval(() => {
    const quedan = H.duracion - (T.ahora() - inicio) / 1000;
    const segs = document.getElementById("segs"), arco = document.getElementById("arco"), reloj = document.getElementById("reloj");
    if (segs) segs.textContent = Math.max(0, Math.ceil(quedan));
    if (arco) arco.setAttribute("stroke-dashoffset", (276.5 * (1 - Math.max(0, quedan) / H.duracion)).toFixed(1));
    if (reloj) reloj.classList.toggle("urgente", quedan <= 5);
    if (quedan <= -0.8) cerrarPregunta(); // pequeño margen para respuestas en camino
  }, 100);
}

function actualizarRespondidas() {
  const el = document.getElementById("respondidas"); if (!el || !H.actual) return;
  const n = Object.keys(H.actual.respuestas).filter(id => H.jugadores[id]).length;
  el.innerHTML = `<b>${n}</b> / ${Object.keys(H.jugadores).length} han respondido`;
}

async function cerrarPregunta() {
  const A = H.actual; if (!A || A.cerrada) return;
  A.cerrada = true; clearInterval(relojId); offRespuestas && offRespuestas(); offRespuestas = null;
  const resp = (await T.get(`${rutaSala()}/respuestas/${A.clave}`)) || A.respuestas || {};
  const res = {}, votos = A.q.opciones.map(() => 0);
  Object.keys(H.jugadores).forEach(id => {
    const r = resp[id]; let pts = 0, opcion = -1;
    if (r && typeof r.t === "number") {
      const seg = Math.max(0, (r.t - A.inicio) / 1000);
      if (seg <= H.duracion + 1) {
        opcion = r.opcion; if (votos[opcion] !== undefined) votos[opcion]++;
        if (opcion === A.q.correcta) pts = calcularPuntos(seg, H.duracion);
      }
    }
    if (!H.puntos[id]) H.puntos[id] = []; if (!H.aciertos[id]) H.aciertos[id] = [];
    H.puntos[id][H.nivel] = ptsNivel(id, H.nivel) + pts;
    H.aciertos[id][H.nivel] = (H.aciertos[id][H.nivel] || 0) + (pts > 0 ? 1 : 0);
    res[id] = { o: opcion, p: pts };
  });
  H.pregunta = A.idx + 1; H.ultimo = { res, votos }; H.fase = "resultado";
  guardarPartida();
  await T.set(`${rutaSala()}/estado`, { fase: "resultado", nivel: H.nivel, pregunta: A.idx, total: NIVELES[H.nivel].preguntas.length, correcta: A.q.correcta, textoCorrecta: A.q.opciones[A.q.correcta], res, clave: A.clave });
  T.set(`${rutaSala()}/respuestas/${A.clave}`, null);
  pintarResultado();
}

function rankingNivel(n) {
  return Object.keys(H.jugadores).sort((a, b) => ptsNivel(b, n) - ptsNivel(a, n) || nombre(a).localeCompare(nombre(b)));
}
function filaRank(id, pos, pts, extra = "", oro = false) {
  return `<div class="fila-rank${oro ? " oro" : ""}"><span class="pos">${pos}</span><span class="punto" style="background:${colorJug(id)}"></span>
    <span class="nom">${esc(nombre(id))}</span><span class="pts">${pts}${extra}</span></div>`;
}

function pintarResultado() {
  const A = H.actual, { res, votos } = H.ultimo, nv = NIVELES[H.nivel];
  const totalVotos = votos.reduce((a, b) => a + b, 0) || 1;
  const top = rankingNivel(H.nivel).slice(0, 6);
  const ultima = H.pregunta >= nv.preguntas.length;
  $app.innerHTML = `<div class="pantalla">${cabeceraPantalla(`<span class="etiqueta" style="background:${colorNivel(H.nivel)}">Nivel ${H.nivel + 1} · Pregunta ${A.idx + 1}/${nv.preguntas.length}</span>`)}
    <div class="centro">
      <div class="pregunta-txt" style="font-size:clamp(22px,2.6vw,40px);padding:20px 28px">${esc(A.q.texto)}</div>
      <div class="resultado-grid">
        <div class="opciones">${A.q.opciones.map((o, i) => `<div class="opcion o${i} ${i === A.q.correcta ? "correcta" : "apagada"}">
          <span class="forma">${i === A.q.correcta ? "✔" : FORMAS[i]}</span><span>${esc(o)}</span><span class="votos">${votos[i]}</span>
          <span class="barra-votos" style="width:${(votos[i] / totalVotos * 100).toFixed(0)}%"></span></div>`).join("")}</div>
        <div class="tabla-top"><h3>Clasificación del nivel</h3>
          ${(() => { let pos = 0, prev = null; const max = top.length ? ptsNivel(top[0], H.nivel) : 0;
            return top.map((id, i) => { const p = ptsNivel(id, H.nivel); if (p !== prev) { pos = i + 1; prev = p; }
              return filaRank(id, pos, p, res[id] && res[id].p ? `<span class="mas">+${res[id].p}</span>` : "", p === max && p > 0); }).join(""); })() || `<p style="color:var(--suave)">Sin participantes</p>`}
        </div>
      </div>
      <button class="btn color" data-siguiente onclick="${ultima ? "finNivel()" : "lanzarPregunta()"}">${ultima ? "Ver resultados del nivel" : "Siguiente pregunta"}</button>
    </div></div>`;
}

async function finNivel() {
  const n = H.nivel, orden = rankingNivel(n);
  const max = orden.length ? ptsNivel(orden[0], n) : 0;
  const ganadores = max > 0 ? orden.filter(id => ptsNivel(id, n) === max) : [];
  ganadores.forEach(id => { if (!H.quesitos[id]) H.quesitos[id] = []; if (!H.quesitos[id].includes(n)) H.quesitos[id].push(n); });
  H.fase = "finNivel"; guardarPartida();
  const resumen = {}; let pos = 0, prev = null;
  orden.forEach((id, i) => { const p = ptsNivel(id, n); if (p !== prev) { pos = i + 1; prev = p; } resumen[id] = { pos, p, q: ganadores.includes(id), nq: nQuesitos(id), gan: H.quesitos[id] || [] }; });
  await T.set(`${rutaSala()}/estado`, { fase: "finNivel", nivel: n, totalNiveles: NIVELES.length, tema: NIVELES[n].tema, resumen });
  const ultimo = n >= NIVELES.length - 1;
  $app.innerHTML = `<div class="pantalla">${cabeceraPantalla()}
    <div class="centro"><div class="fin-nivel">
      <h2 style="font-size:clamp(30px,3.6vw,54px)">Fin del nivel ${n + 1}: <span style="color:${colorNivel(n)}">${esc(NIVELES[n].tema)}</span></h2>
      ${ganadores.length ? `<div style="font-size:24px;color:var(--suave)">${ganadores.length > 1 ? "¡Empate! Se llevan el quesito:" : "Se lleva el quesito:"}</div>
        <div class="ganadores">${ganadores.map((id, i) => `<div class="ganador" style="animation-delay:${i * .15}s"><div class="q">${quesitoSVG(NIVELES.length, [], n)}</div>
          <div class="nom" style="color:${colorJug(id)}">${esc(nombre(id))}</div><div class="pts">${max} puntos</div></div>`).join("")}</div>`
        : `<div style="font-size:26px">Nadie ha acertado en este nivel: el quesito queda desierto.</div>`}
      <div class="scroll"><div class="rank-cols">${orden.map(id => filaRank(id, resumen[id].pos, ptsNivel(id, n), "", resumen[id].q)).join("")}</div></div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
        <button class="btn secundario" onclick="verMarcador()">Ver marcador acumulado</button>
        <button class="btn color" data-siguiente onclick="${ultimo ? "finalPartida()" : `empezarNivel(${n + 1})`}">${ultimo ? "Ver resultado final 🏆" : "Siguiente nivel"}</button>
      </div>
    </div></div></div>`;
}

function ordenFinal() {
  return Object.keys(H.jugadores).sort((a, b) => nQuesitos(b) - nQuesitos(a) || ptsTotal(b) - ptsTotal(a) || nombre(a).localeCompare(nombre(b)));
}
function tablaMarcador(hastaNivel) {
  const orden = ordenFinal();
  return `<table class="tabla-final"><thead><tr><th>#</th><th>Participante</th>
    ${NIVELES.slice(0, hastaNivel + 1).map((n, i) => `<th style="color:${colorNivel(i)}">N${i + 1}</th>`).join("")}
    <th>Total</th><th>Quesitos</th></tr></thead><tbody>
    ${orden.map((id, i) => `<tr><td>${i + 1}</td><td><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${colorJug(id)};margin-right:8px"></span>${esc(nombre(id))}</td>
      ${NIVELES.slice(0, hastaNivel + 1).map((_, n) => `<td class="${(H.quesitos[id] || []).includes(n) ? "ganado" : ""}" style="${(H.quesitos[id] || []).includes(n) ? `background:${colorNivel(n)}` : ""}">${ptsNivel(id, n)}</td>`).join("")}
      <td><b>${ptsTotal(id)}</b></td><td class="q-celda">${quesitoSVG(NIVELES.length, H.quesitos[id] || [])} <b>${nQuesitos(id)}</b></td></tr>`).join("")}
    </tbody></table>`;
}
function verMarcador() {
  const n = H.nivel, ultimo = n >= NIVELES.length - 1;
  $app.innerHTML = `<div class="pantalla">${cabeceraPantalla()}
    <div class="centro"><div class="fin-nivel">
      <h2 style="font-size:clamp(30px,3.4vw,50px)">Marcador tras el nivel ${n + 1}</h2>
      <div class="scroll" style="max-height:60vh">${tablaMarcador(n)}</div>
      <button class="btn color" data-siguiente onclick="${ultimo ? "finalPartida()" : `empezarNivel(${n + 1})`}">${ultimo ? "Ver resultado final 🏆" : "Siguiente nivel"}</button>
    </div></div></div>`;
}

async function finalPartida() {
  H.fase = "final";
  const orden = ordenFinal(), resumen = {};
  orden.forEach((id, i) => { resumen[id] = { pos: i + 1, nq: nQuesitos(id), gan: H.quesitos[id] || [], t: ptsTotal(id) }; });
  await T.set(`${rutaSala()}/estado`, { fase: "final", totalNiveles: NIVELES.length, resumen });
  try { localStorage.removeItem(GUARDADO); } catch (e) {}
  const p = orden.slice(0, 3);
  const peldano = (id, k) => id ? `<div class="peldano p${k}" style="animation-delay:${(3 - k) * .3}s">
      <div class="q">${quesitoSVG(NIVELES.length, H.quesitos[id] || [])}</div><div class="nom">${esc(nombre(id))}</div>
      <div class="det">${nQuesitos(id)} quesito${nQuesitos(id) === 1 ? "" : "s"} · ${ptsTotal(id)} pts</div><div class="bloque">${k}</div></div>` : "";
  $app.innerHTML = `<div class="pantalla">${cabeceraPantalla()}
    <div class="centro"><div class="fin-nivel">
      <h2 style="font-size:clamp(30px,3.4vw,52px)">🏆 Resultado final</h2>
      <div class="podio">${peldano(p[1], 2)}${peldano(p[0], 1)}${peldano(p[2], 3)}</div>
      <div class="scroll" style="max-height:30vh">${tablaMarcador(NIVELES.length - 1)}</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
        <button class="btn secundario" onclick="cerrarSala()">Cerrar la sala</button>
        <button class="btn color" onclick="cerrarSala(true)">Nueva partida</button>
      </div>
    </div></div></div>`;
}

async function cerrarSala(nueva) {
  offJugadores && offJugadores(); offJugadores = null;
  await T.set(rutaSala(), null);
  H.sala = null; H.jugadores = {};
  if (nueva) return hostInicio();
  $app.innerHTML = `<div class="pantalla">${cabeceraPantalla()}<div class="centro"><h2 style="font-size:48px">¡Gracias por jugar!</h2>
    <button class="btn color" onclick="hostInicio()">Volver al inicio</button></div></div>`;
}

/* =====================================================================
   VISTA DE MÓVIL (JUGADOR)
   ===================================================================== */
const J = { sala: (params.get("sala") || "").toUpperCase(), id: null, nombre: null, color: null, estado: null, respondida: {}, fuera: false };
let offEstado = null, offYo = null, barraId = null;

function claveLocal() { return `trivialAlmacen_jugador_${J.sala}`; }
// En modo prueba cada pestaña es un jugador distinto; con móviles, se recuerda aunque se cierre la pestaña.
const almacen = () => (T.modo() === "firebase" ? localStorage : sessionStorage);

function movil(contenido, clase = "") {
  const yo = J.id ? `<div class="yo"><span class="punto" style="background:${J.color}"></span><span>${esc(J.nombre)}</span></div>` : `<div></div>`;
  $app.innerHTML = `<div class="movil ${clase}"><div class="cabecera">${yo}<span>${J.sala ? "Sala " + esc(J.sala) : ""}</span></div><div class="cuerpo">${contenido}</div></div>`;
}

async function jugadorInicio() {
  if (!J.sala) return pedirCodigo();
  let guardado = null; try { guardado = JSON.parse(almacen().getItem(claveLocal())); } catch (e) {}
  if (guardado) {
    const yo = await T.get(`${RAIZ}/${J.sala}/jugadores/${guardado.id}`);
    if (yo) { Object.assign(J, guardado); return conectar(); }
  }
  pedirNombre();
}

function pedirCodigo(error = "") {
  movil(`<div style="width:110px;height:110px">${quesitoSVG(NIVELES.length, NIVELES.map((_, i) => i))}</div>
    <h2>${esc(AJUSTES.titulo)}</h2><p>Escribe el código de sala que aparece en la pantalla</p>
    <div class="entrada"><input id="cod" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD">
    <div class="error">${esc(error)}</div><button class="btn color" onclick="enviarCodigo()">Entrar</button></div>`);
  const i = document.getElementById("cod"); i.focus(); i.onkeydown = e => { if (e.key === "Enter") enviarCodigo(); };
}
async function enviarCodigo() {
  const c = document.getElementById("cod").value.trim().toUpperCase(); if (c.length !== 4) return pedirCodigo("El código tiene 4 letras");
  J.sala = c; const e = await T.get(`${RAIZ}/${c}/estado`);
  if (!e) { J.sala = ""; return pedirCodigo("No encuentro esa sala. Revisa el código."); }
  jugadorInicio();
}

async function pedirNombre(error = "") {
  const e = await T.get(`${RAIZ}/${J.sala}/estado`);
  if (!e) { const s = J.sala; J.sala = ""; return pedirCodigo(`La sala ${s} no existe o ya se ha cerrado.`); }
  movil(`<div style="width:110px;height:110px">${quesitoSVG(NIVELES.length, NIVELES.map((_, i) => i))}</div>
    <h2>${esc(AJUSTES.titulo)}</h2>
    ${J.fuera ? `<p style="color:#ffcf3a">El profesor ha quitado tu nombre de la partida. Elige otro para volver a entrar.</p>` : `<p>Elige un nombre para ti o para tu equipo</p>`}
    <div class="entrada"><input id="nom" maxlength="15" autocomplete="off" placeholder="Tu nombre">
    <div class="error">${esc(error)}</div><button class="btn color" id="btnUnir" onclick="unirse()">¡Jugar!</button></div>`);
  const i = document.getElementById("nom"); i.focus(); i.onkeydown = ev => { if (ev.key === "Enter") unirse(); };
}

async function unirse() {
  const nom = document.getElementById("nom").value.replace(/\s+/g, " ").trim();
  if (nom.length < 2) return pedirNombre("Escribe al menos 2 letras");
  document.getElementById("btnUnir").disabled = true;
  const lista = (await T.get(`${RAIZ}/${J.sala}/jugadores`)) || {};
  if (Object.values(lista).some(j => j.nombre.toLowerCase() === nom.toLowerCase())) return pedirNombre("Ese nombre ya está cogido, prueba con otro");
  const usados = Object.values(lista).map(j => j.color);
  const libres = COLORES_JUG.filter(c => !usados.includes(c));
  Object.assign(J, { id: nuevoId(), nombre: nom, color: (libres.length ? libres : COLORES_JUG)[Math.floor(Math.random() * (libres.length || COLORES_JUG.length))], fuera: false });
  await T.set(`${RAIZ}/${J.sala}/jugadores/${J.id}`, { nombre: J.nombre, color: J.color, entrada: T.sello() });
  try { almacen().setItem(claveLocal(), JSON.stringify({ id: J.id, nombre: J.nombre, color: J.color })); } catch (e) {}
  conectar();
}

function conectar() {
  offEstado && offEstado(); offYo && offYo();
  let visto = false;
  offYo = T.on(`${RAIZ}/${J.sala}/jugadores/${J.id}`, v => {
    if (v) { visto = true; return; }
    if (!visto) return;
    offEstado && offEstado(); offYo && offYo();
    try { almacen().removeItem(claveLocal()); } catch (e) {}
    J.id = null; J.fuera = true; pedirNombre();
  });
  offEstado = T.on(`${RAIZ}/${J.sala}/estado`, e => { J.estado = e; pintarMovil(); });
}

function pintarMovil() {
  const e = J.estado; clearInterval(barraId);
  if (!e) { movil(`<div class="grande">👋</div><h2>La partida ha terminado</h2><p>¡Gracias por jugar!</p>`); return; }
  const totalN = e.totalNiveles || NIVELES.length;
  switch (e.fase) {
    case "lobby":
      return movil(`<div class="grande">🙌</div><h2>¡Ya estás dentro!</h2><p>Mira la pantalla: el juego empezará enseguida.</p>`);
    case "pausa":
      return movil(`<div class="grande">⏸️</div><h2>Partida en pausa</h2><p>Espera a que el profesor la reanude.</p>`);
    case "nivel":
      return movil(`<div class="quesito-movil">${quesitoSVG(totalN, [], e.nivel)}</div><p>Nivel ${e.nivel + 1} de ${totalN}</p>
        <h2 style="color:${colorNivel(e.nivel)}">${esc(e.tema)}</h2><p>¡Prepárate!</p>`);
    case "pregunta": {
      const quedan = e.duracion - (T.ahora() - e.inicio) / 1000;
      if (J.respondida[e.clave] !== undefined) {
        const i = J.respondida[e.clave];
        return movil(`<div class="grande">${FORMAS[i]}</div><h2>¡Respuesta enviada!</h2><p>Has elegido: <b style="color:#fff">${esc(e.opciones[i])}</b></p><p>Espera a que termine el tiempo…</p>`);
      }
      if (quedan <= 0) return movil(`<div class="grande">⏰</div><h2>¡Se acabó el tiempo!</h2>`);
      movil(`<div style="width:100%;display:flex;flex-direction:column;gap:12px;flex:1">
        <div style="display:flex;justify-content:space-between;color:var(--suave);font-weight:600"><span>Nivel ${e.nivel + 1} · ${e.pregunta + 1}/${e.total}</span><span id="segMovil"></span></div>
        <div class="barra-tiempo"><i id="barraMovil" style="background:${colorNivel(e.nivel)}"></i></div>
        <div class="preg-movil">${esc(e.texto)}</div>
        <div class="botones ${e.opciones.length === 2 ? "dos" : ""}">${e.opciones.map((o, i) => `<button class="resp o${i}" onclick="responder(${i})"><span class="forma">${FORMAS[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
      </div>`);
      document.querySelector(".movil .cuerpo").style.justifyContent = "stretch";
      const tic = () => {
        const q = e.duracion - (T.ahora() - e.inicio) / 1000;
        const b = document.getElementById("barraMovil"), s = document.getElementById("segMovil");
        if (b) b.style.width = Math.max(0, q / e.duracion * 100) + "%";
        if (s) s.textContent = Math.max(0, Math.ceil(q)) + " s";
        if (q <= 0) { clearInterval(barraId); pintarMovil(); }
      };
      tic(); barraId = setInterval(tic, 100);
      return;
    }
    case "resultado": {
      const r = e.res && e.res[J.id];
      if (!r || r.o === -1) return movil(`<div class="grande">⏰</div><h2>No ha dado tiempo</h2><p>La correcta era:</p><h2 style="font-size:24px">${esc(e.textoCorrecta)}</h2>`, "mal");
      if (r.p > 0) return movil(`<div class="grande">✅</div><h2>¡Correcto!</h2><div class="puntos">+${r.p}</div><p>${r.p === AJUSTES.puntosMaximos ? "¡Rapidísimo! Puntuación máxima" : "Cuanto más rápido, más puntos"}</p>`, "ok");
      return movil(`<div class="grande">❌</div><h2>¡Casi!</h2><p style="color:#fff">La correcta era:</p><h2 style="font-size:24px">${esc(e.textoCorrecta)}</h2>`, "mal");
    }
    case "finNivel": {
      const r = e.resumen && e.resumen[J.id];
      if (!r) return movil(`<h2>Fin del nivel ${e.nivel + 1}</h2><p>Mira la pantalla</p>`);
      return movil(`<div class="quesito-movil">${quesitoSVG(totalN, r.gan || [])}</div>
        <h2>${r.q ? "¡Quesito para ti! 🎉" : `Fin del nivel ${e.nivel + 1}`}</h2>
        <p>Has quedado <b style="color:#fff">${r.pos}.º</b> con <b style="color:#fff">${r.p} puntos</b></p>
        <p>Llevas ${r.nq} quesito${r.nq === 1 ? "" : "s"} de ${totalN}</p>`);
    }
    case "final": {
      const r = e.resumen && e.resumen[J.id];
      if (!r) return movil(`<h2>¡Fin del juego!</h2><p>Mira la pantalla</p>`);
      const medalla = ["🥇", "🥈", "🥉"][r.pos - 1] || "🏁";
      return movil(`<div class="grande">${medalla}</div><h2>Puesto ${r.pos}.º</h2>
        <div class="quesito-movil">${quesitoSVG(totalN, r.gan || [])}</div>
        <p><b style="color:#fff">${r.nq}</b> quesito${r.nq === 1 ? "" : "s"} · <b style="color:#fff">${r.t}</b> puntos en total</p>`);
    }
  }
}

async function responder(i) {
  const e = J.estado; if (!e || e.fase !== "pregunta" || J.respondida[e.clave] !== undefined) return;
  J.respondida[e.clave] = i;
  if (navigator.vibrate) navigator.vibrate(40);
  pintarMovil();
  await T.set(`${RAIZ}/${J.sala}/respuestas/${e.clave}/${J.id}`, { opcion: i, t: T.sello() });
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
(async () => {
  await T.iniciar();
  const esJugador = params.has("sala") || params.has("jugar");
  if (esJugador) jugadorInicio(); else hostInicio();
})();
</script>
</body>
</html>
